<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #1a73e8;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.ok { background: #e6f4ea; color: #1e7e34; }
    .status.warn { background: #fff3cd; color: #856404; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #e7f1ff; color: #004085; }
    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.primary {
      background: #1a73e8;
      color: white;
    }
    button.primary:hover { background: #1557b0; }
    button.primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button.secondary {
      background: #f1f3f4;
      color: #333;
    }
    button.secondary:hover { background: #e8eaed; }
    .progress {
      display: none;
      margin-top: 12px;
    }
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #1a73e8;
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
      text-align: center;
    }
    .tips {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
    .tips li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>📄 Box VDR Extractor</h1>
  
  <div id="status" class="status info">Checking page...</div>
  
  <button id="extractBtn" class="primary" disabled>Extract to PDF</button>
  <button id="diagBtn" class="secondary">Run Diagnostic</button>
  
  <div id="progress" class="progress">
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="progressText" class="progress-text">Starting...</div>
  </div>
  
  <div class="tips">
    <strong>Tips for best quality:</strong>
    <ul>
      <li>Close the thumbnail sidebar</li>
      <li>Maximize your browser window</li>
      <li>Set browser zoom to 100%</li>
    </ul>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
